[package]
name = "ii"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Two taps. Any directory. A keyboard-first terminal navigator."
license = "MIT"
repository = "https://github.com/Mik-pe/ii"
readme = "README.md"
publish = false

[dependencies]
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["std", "crossterm", "layout-cache"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[[bench]]
name = "navigation"
harness = false
