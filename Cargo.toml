[package]
name = "in-i"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "in i (ii): a keyboard-first terminal directory navigator with shell integration."
license = "MIT"
repository = "https://github.com/Mik-pe/ii"
readme = "README.md"
publish = ["crates-io"]
keywords = ["navigation", "terminal", "directory", "shell", "cli"]
categories = ["command-line-utilities"]
include = ["src/**", "shell/**", "tests/**", "examples/**", "benches/**", "scripts/**", "docs/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CONTRIBUTING.md", "rust-toolchain.toml"]

[lib]
name = "ii"

[[bin]]
name = "ii"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["std", "crossterm", "layout-cache"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[[bench]]
name = "navigation"
harness = false
