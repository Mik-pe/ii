# One-time preparation confined to the feature branch; removed before merge.
name: Prepare Tab navigation
on:
  push:
    branches: [fix/tab-navigates-in-ui]
    paths: [.github/workflows/prepare-tab.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Apply exact scoped edits
        run: |
          python3 .github/prepare-tab.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/test_pty.py')
          text = path.read_text(encoding='utf-8')
          old = "        session.expect(b'No visible entries', mark)"
          new = "        # The renderer emits cell diffs, not complete empty-state sentences.\n        # Synchronize on the new header suffix and zero-entry status instead.\n        session.expect(b'/src', mark)\n        session.expect(b'0/0', mark)"
          assert text.count(old) == 1
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Format and regenerate the actual UI snapshot
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          cargo fmt --all
          cargo run --locked --example render_demo > "$RUNNER_TEMP/ii-demo.svg"
          cp "$RUNNER_TEMP/ii-demo.svg" docs/assets/demo.svg
      - name: Rust checks and real terminal tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo build --locked --release
          python3 scripts/test_pty.py target/release/ii
      - name: Commit verified source changes on feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.rs src/model.rs src/ui.rs scripts/test_pty.py README.md docs/ARCHITECTURE.md docs/assets/demo.svg CONTRIBUTING.md AGENTS.md
          git diff --cached --stat
          git diff --cached --check
          git commit -m 'fix: keep Tab in the navigator and reserve cd for Enter'
          git push origin HEAD:fix/tab-navigates-in-ui
      - name: Review artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tab-navigation-review
          path: |
            src/
            scripts/test_pty.py
            docs/assets/demo.svg
            target/release/ii
          if-no-files-found: error
