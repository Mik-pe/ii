# Temporary initialization workflow; removed after generated files are verified.
name: Bootstrap formatting and assets
on:
  push:
    branches: [main]
    paths: [.github/workflows/bootstrap.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Apply verified compiler suggestions
        run: |
          cargo clippy --fix --locked --allow-dirty --allow-staged --all-targets
          cargo fmt --all
      - name: Finalize cover
        run: python3 .github/finish_cover.py
      - name: Commit generated files without rewriting history
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src tests benches docs .github/bootstrap-cover.webp
          if ! git diff --cached --quiet; then
            git commit -m 'chore: apply Rust lints and verify README cover asset'
            git push origin HEAD:main
          fi
      - name: Compile and test
        if: always()
        run: cargo test --locked --all-targets
      - name: Check lints
        if: always()
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build release
        if: always()
        run: cargo build --locked --release
      - name: Real terminal tests
        if: always()
        run: python3 scripts/test_pty.py target/release/ii
      - name: Install shells
        if: always()
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish
      - name: Shell tests
        if: always()
        run: python3 scripts/test_shells.py
      - name: Release benchmark
        if: always()
        run: cargo bench --locked --bench navigation
